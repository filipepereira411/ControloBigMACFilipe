<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ControloBigMACFilipe — Gestão de IPs</title>
    <link rel="stylesheet" href="https://googleapis.com">
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-card: #111823;
            --bg-input: #172030;
            --border-color: #1f293d;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --color-green: #10b981;
            --color-red: #f43f5e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'IBM Plex Sans', sans-serif;
            padding: 2rem;
            min-height: 100vh;
        }

        /* --- HEADER --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .brand .logo {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .brand .logo span {
            color: var(--color-green);
        }

        .brand .subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 0.25rem;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .counters {
            display: flex;
            gap: 1.25rem;
            font-size: 0.9rem;
        }

        .counters p span {
            font-weight: 600;
        }

        .counters p .count-online { color: var(--color-green); }
        .counters p .count-others { color: var(--color-red); }

        .btn-primary {
            background-color: #166534;
            color: #ffffff;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-primary:hover {
            background-color: #15803d;
        }

        /* --- LAYOUT PRINCIPAL --- */
        .dashboard {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 1.5rem;
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.5rem;
        }

        /* --- FILTROS DE PESQUISA --- */
        .search-bar {
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 6px;
            font-size: 0.9rem;
            margin-bottom: 0.75rem;
            outline: none;
        }

        .select-filter {
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: 100%;
            padding: 0.75rem;
            border-radius: 6px;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            outline: none;
            cursor: pointer;
        }

        /* --- TABELA --- */
        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }

        th {
            color: var(--text-muted);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 0.75rem 0.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        td {
            padding: 1rem 0.5rem;
            border-bottom: 1px solid rgba(31, 41, 61, 0.4);
        }

        tbody tr {
            cursor: pointer;
            transition: background-color 0.15s;
        }

        tbody tr:hover {
            background-color: rgba(255, 255, 255, 0.02);
        }

        tbody tr.active-row {
            background-color: rgba(16, 185, 129, 0.08);
        }

        .ip-column {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .indicator {
            width: 6px;
            height: 6px;
            background-color: var(--color-green);
            border-radius: 50%;
        }

        .mac-address {
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-muted);
        }

        .btn-delete {
            color: var(--color-red);
            text-decoration: none;
            font-size: 0.85rem;
        }

        .btn-delete:hover {
            text-decoration: underline;
        }

        /* --- PAINEL LATERAL DE DETALHES --- */
        .panel-placeholder {
            color: var(--text-muted);
            font-size: 0.9rem;
            text-align: center;
            padding: 3rem 1rem;
        }

        .details-container h2 {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.1rem;
            color: var(--color-green);
            margin-bottom: 1.25rem;
        }

        .details-grid {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            font-size: 0.9rem;
        }

        .details-row {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid rgba(31, 41, 61, 0.3);
            padding-bottom: 0.5rem;
        }

        .details-label {
            color: var(--text-muted);
        }

        .details-value {
            font-weight: 500;
        }

        .details-value.mono {
            font-family: 'JetBrains Mono', monospace;
        }
    </style>
</head>
<body>

    <!-- Header / Topo -->
    <header>
        <div class="brand">
            <div class="logo">> ControloBigMACFilipe<span>_</span></div>
            <div class="subtitle">Gestão de IPs e periféricos</div>
        </div>
        <div class="header-actions">
            <div class="counters">
                <p>Total: <span id="count-total">0</span></p>
                <p>Online: <span id="count-online" class="count-online">0</span></p>
                <p>Outros: <span id="count-others" class="count-others">0</span></p>
            </div>
            <button class="btn-primary" id="add-device-btn">+ Meter IP</button>
        </div>
    </header>

    <!-- Content / Dashboard -->
    <main class="dashboard">
        
        <!-- Bloco de Listagem e Filtros -->
        <section class="card">
            <input type="text" id="search-input" class="search-bar" placeholder="Procurar IP, MAC, nome, fabricante...">
            
            <select id="type-filter" class="select-filter">
                <option value="Todos">Todos</option>
                <option value="Router">Router</option>
                <option value="Impressora">Impressora</option>
                <option value="Portátil">Portátil</option>
            </select>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>IP</th>
                            <th>MAC</th>
                            <th>Hostname</th>
                            <th>Tipo</th>
                            <th>Fabricante</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="devices-list">
                        <!-- Gerado dinamicamente via JS para permitir controlo mútuo perfeito -->
                    </tbody>
                </table>
            </div>
        </section>

        <!-- Bloco de Detalhes -->
        <aside class="card" id="details-sidebar" style="height: fit-content;">
            <div class="panel-placeholder">
                Escolhe um periférico para ver os detalhes.
            </div>
        </aside>

    </main>

    <!-- Lógica de Controlo Mútuo -->
    <script>
        // Base de dados local (Array de objetos)
        let dispositivos = [
            { id: 1, ip: "192.168.1.1", mac: "A4:2B:B0:11:22:33", hostname: "router-principal", tipo: "Router", fabricante: "TP-Link" },
            { id: 2, ip: "192.168.1.20", mac: "3C:52:82:AA:BB:CC", hostname: "impressora-hp", tipo: "Impressora", fabricante: "HP" },
            { id: 3, ip: "192.168.1.50", mac: "F0:18:98:12:34:56", hostname: "macbook-filipe", tipo: "Portátil", fabricante: "Apple" }
        ];

        let dispositivoSelecionadoId = null;

        // Elementos do DOM
        const devicesList = document.getElementById('devices-list');
        const searchInput = document.getElementById('search-input');
        const typeFilter = document.getElementById('type-filter');
        const detailsSidebar = document.getElementById('details-sidebar');

        // Renderiza e atualiza os contadores globais
        function renderCounters() {
            document.getElementById('count-total').textContent = dispositivos.length;
            document.getElementById('count-online').textContent = dispositivos.length; // Simulando todos ativos
            document.getElementById('count-others').textContent = 0;
        }

        // Renderiza o painel lateral com base no estado atual
        function renderDetailsPanel() {
            const dispositivo = dispositivos.find(d => d.id === dispositivoSelecionadoId);
            
            if (!dispositivo) {
                detailsSidebar.innerHTML = `
                    <div class="panel-placeholder">
